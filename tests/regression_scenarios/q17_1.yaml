  attribution: Sol-authored from Claude's Q17.1 addendum adopting Astra's review;
    expectations supplied by that ruling
  setup:
    records: *id001
    grants:
      G1: *id002
      G2:
        parent: G0
        grantor: F
        grantee: A
        actions: *id003
        scope:
          customers:
          - K2
          template:
          - refund_issued
        limits: *id004
        purpose: P1
        expires_at: 100
        status: live
  steps:
  - step: 1
    propose:
      actor: A
      tool: message_party
      args:
        claim: CL1
        to: K1
        amount: 120
        template: refund_issued
        cites: REF1
    expect:
      disposition: REFUSE
- id: R-Q171-implicit-template-restricted
  attribution: Sol-authored from Claude's Q17.1 addendum adopting Astra's review;
    expectations supplied by that ruling
  setup:
    records:
      RET1:
        received: true
    grants:
      G1: *id002
  steps:
  - step: 1
    propose:
      actor: A
      tool: hold_refund
      args:
        claim: CL1
        missing: return receipt
        template: refund_denied
    expect:
      disposition: REFUSE
- id: R-Q171-implicit-template-allowed
  attribution: Sol-authored from Claude's Q17.1 addendum adopting Astra's review;
    expectations supplied by that ruling
  setup:
    records:
      RET1:
        received: true
    grants:
      G1:
        scope:
          template:
          - refund_held
  steps:
  - step: 1
    propose:
      actor: A
      tool: hold_refund
      args:
        claim: CL1
        missing: return receipt
