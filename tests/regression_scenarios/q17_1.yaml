      disposition: PERMIT
- id: R-Q171-tighten-before-execution
  attribution: Sol-authored from Claude's Q17.1 addendum adopting Astra's review;
    expectations supplied by that ruling
  setup:
    records: *id001
    grants:
      G1:
        scope:
          template:
          - refund_issued
  steps:
  - step: 1
    propose:
      actor: A
      tool: message_party
      args:
        claim: CL1
        to: K1
        amount: 120
        template: refund_issued
        cites: REF1
    expect:
      disposition: PERMIT
  - step: 2
    events:
    - type: grant_amendment
      by: F
      grant: G1
      change:
        scope:
          template:
          - refund_denied
  - step: 2
    propose:
      actor: A
      tool: message_party
      args:
        claim: CL1
        to: K1
        amount: 120
        template: refund_issued
        cites: REF1
    expect:
      disposition: REFUSE
  - step: 2
    execute:
      actor: A
      token: T1
    expect:
      action_executed: false
      committed: []
- id: R-Q171-omitted-template
  attribution: Sol-authored from Claude's Q17.1 addendum adopting Astra's review;
    expectations supplied by that ruling
  setup:
    records: *id001
    grants:
      G1:
        scope:
          template:
          - refund_denied
  steps:
  - step: 1
    propose:
      actor: A
      tool: message_party
      args:
        claim: CL1
        to: K1
        prose: Status update.
    expect:
      disposition: REFUSE
