# Separate Q17 regressions; frozen v0.2.2 and W0 stay unchanged.
- id: R-Q17-leaf-template
  attribution: Sol-authored from Claude's Q17 clarification relayed by Chris; expectations
    supplied by that ruling
  setup:
    records:
      RET1:
        received: true
      REF1:
        kind: refund
        claim: CL1
        claimant: K1
        order: ORD1
        amount: 120
        currency: USD
        settled: true
        to: K1_card
    grants:
      G1:
        scope:
          customers:
          - K1
          - K2
          template:
          - refund_denied
  steps:
  - step: 1
    propose:
      actor: A
      tool: message_party
      args: &id001
        claim: CL1
        to: K1
        amount: 120
        template: refund_issued
        cites: REF1
    expect:
      disposition: REFUSE
