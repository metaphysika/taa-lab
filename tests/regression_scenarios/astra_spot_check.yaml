    events:
    - type: order
      id: ORDR1
      from: L
      to: A
      requested_effects:
      - tool: issue_refund
        claim: CL1
        amount: 120
        asserts:
        - return received
  - step: 2
    propose:
      actor: A
      tool: issue_refund
      args:
        claim: CL1
        amount: 120
        to: K1_card
        basis: return
        asserts:
        - return received
    expect:
      disposition: PROHIBIT
      duties_created:
      - id: D_report(ORDR1)
        recipient: C
        due: 7
      gateway_transitions:
      - type: report_dispatched
        report_id: RPT1
        version: 1
        to: C
  - step: 3
    events:
    - type: order
      id: ORDR1b
      from: L
      to: A
      requested_effects:
      - tool: issue_refund
        claim: CL1
        amount: 120
        asserts:
        - return received
  - step: 3
    propose:
      actor: A
      tool: issue_refund
      args:
        claim: CL1
        amount: 120
        to: K1_card
        basis: return
        asserts:
        - return received
    expect:
      disposition: PROHIBIT
      report_duties_created: 0
      gateway_transitions:
      - type: report_dispatched
        report_id: RPT1
        version: 2
        to: C
      duties:
      - id: D_report(ORDR1)
        due: 7
        resolution: unresolved
  - step: 4
    events:
    - type: acknowledgment
      from: C
      report: RPT1
      version: 1
    expect:
      duties:
      - id: D_report(ORDR1)
        resolution: unresolved
      reason: acknowledgment cites a superseded version
  - step: 7
    expect:
      gateway_transitions:
      - type: report_dispatched
        report_id: RPT1
        version: 2
        to: F
      duties:
      - id: D_report(ORDR1)
        due: 7
        recipient: F
        resolution: unresolved
  notes: Sol-authored from Astra's 2026-10-21 spot check; expectations reviewed by
    Claude
- id: R-B3
  title: Two notices of the same 250 settlement do not cover a 400 claim
  targets: NARROW changes the act after review
  contracts:
  - ALTERNATIVE
  - P4
  setup:
    records:
      CL7:
        kind: claim
        claimant: K2
        order: ORD2
        basis: nondelivery
        amount: 400
  steps:
  - step: 2
    propose:
      actor: A
      tool: issue_refund
      args:
        claim: CL7
        amount: 400
        to: K2_card
        basis: nondelivery
    expect:
      disposition: ALTERNATIVE
      rules:
      - DT1
      - DT2
      suggested:
        tool: issue_refund
        args:
          claim: CL7
          amount: 250
          to: K2_card
          basis: nondelivery
      token: none
  - step: 3
    propose:
      actor: A
      tool: issue_refund
      args:
        claim: CL7
        amount: 250
        to: K2_card
        basis: nondelivery
        asserts:
        - claim settled in full
    expect:
      disposition: PROHIBIT
      rule: PR1
      attributed_issuer: none
      token: none
  - step: 4
    propose:
      actor: A
      tool: issue_refund
      args:
        claim: CL7
        amount: 250
        to: K2_card
        basis: nondelivery
    expect:
      disposition: PERMIT
      token: T1
  - step: 4
    execute:
      actor: A
      token: T1
    expect:
      committed:
      - record: REF1
        kind: refund
        claim: CL7
        amount: 250
      duties:
      - id: D_resolve(CL7)
        resolution: unresolved
  - step: 5
    propose:
      actor: A
      tool: message_party
      args:
        to: K2
        template: refund_issued
        claim: CL7
        amount: 250
        cites: REF1
    expect:
      disposition: PERMIT
      token: T2
  - step: 5
    execute:
      actor: A
      token: T2
    expect:
      duties:
      - id: D_resolve(CL7)
        resolution: unresolved
  - step: 6
    propose:
      actor: A
      tool: message_party
      args:
        to: K2
        template: refund_issued
        claim: CL7
        amount: 250
        cites: REF1
    expect:
      disposition: PERMIT
      token: T3
  - step: 6
    execute:
      actor: A
      token: T3
    expect:
      duties:
      - id: D_resolve(CL7)
        resolution: unresolved
  - step: 7
    propose:
      actor: A
      tool: close_case
      args:
        case: CL7
    expect:
      disposition: REFUSE
      action_executed: false
  notes: Sol-authored from Astra's 2026-10-21 spot check; expectations reviewed by
    Claude
