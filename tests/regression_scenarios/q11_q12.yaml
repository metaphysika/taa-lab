# Sol-authored from Claude's Q11/Q12 clarification; expectations reviewed by Claude
- id: R-Q11-tool-message
  title: 11-tool-message
  attribution: Sol-authored from Claude's Q11/Q12 clarification; expectations reviewed
    by Claude
  setup: {}
  steps:
  - step: 2
    propose:
      actor: A
      tool: offer_duty
      args:
        duty: D_resolve(CL1)
        to: F
    expect:
      disposition: PERMIT
      token: T1
  - step: 2
    execute:
      actor: A
      token: T1
    expect:
      duties:
      - id: D_resolve(CL1)
        owner: A
        resolution: unresolved
      live_offers:
        D_resolve(CL1):
        - to: F
          expires_at: 7
      execute_result: committed
  - step: 3
    propose:
      actor: F
      tool: accept_duty
      args:
        duty: D_resolve(CL1)
    expect:
      disposition: REFUSE
      rule: AU1
      failed_stage: authority
      token: none
      action_executed: false
  - step: 4
    events:
    - type: duty_acceptance
      from: F
      duties:
      - D_resolve(CL1)
    expect:
      duties:
      - id: D_resolve(CL1)
        owner: F
        resolution: unresolved
      live_offers:
        D_resolve(CL1): []
- id: R-Q11-no-standing
  title: 11-no-standing
  attribution: Sol-authored from Claude's Q11/Q12 clarification; expectations reviewed
    by Claude
  setup:
    grants:
      GB: &id001
        parent: G0
        grantor: F
        grantee: B
        actions: &id002
        - accept_duty
        scope:
          customers:
          - K1
        limits: &id003 {}
        purpose: P1
        status: live
        expires_at: 100
  steps:
  - step: 2
    propose:
      actor: B
      tool: accept_duty
      args:
        duty: D_resolve(CL1)
    expect:
      disposition: REFUSE
      rule: DU4
      failed_stage: duty
      token: none
      action_executed: false
