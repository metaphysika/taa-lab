# Sol-authored from Claude's Q14-NULL-ALLOCATION ruling; expectations reviewed by Claude
# Separate permanent suite; historical source counts remain unchanged.
- id: R-Q14-allocation-null
  attribution: Sol-authored from Claude's Q14-NULL-ALLOCATION ruling; expectations reviewed by Claude
  setup:
    records:
      RET1: {received: true}
      REFX: {kind: refund, claim: CL1, claimant: K1, order: ORD1, amount: 120, currency: USD, settled: true, to: K1_card, allocated_to: null}
  steps:
  - step: 1
    expect:
      duties: [{id: 'D_refund(CL1,120)', resolution: discharged}]
  - step: 2
    propose: {actor: A, tool: message_party, args: {to: K1, claim: CL1, template: refund_issued, amount: 120, cites: REFX}}
    expect: {disposition: PERMIT, token: T1}
  - step: 2
    execute: {actor: A, token: T1}
    expect:
      duties: [{id: 'D_resolve(CL1)', resolution: discharged}]
