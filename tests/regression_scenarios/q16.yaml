    events:
    - type: duty_acceptance
      from: F
      duties:
      - D_resolve(CL1)
    expect:
      duties:
      - id: D_resolve(CL1)
        owner: F
      live_offers:
        D_resolve(CL1): []
  - step: 8
    expect:
      duties:
      - id: D_resolve(CL1)
        owner: F
      live_offers:
        D_resolve(CL1): []
      revision: R=
  supersedes: R-Q12-parallel-L
