    events:
    - type: duty_acceptance
      from: L
      duties:
      - D_resolve(CL1)
    expect:
      duties:
      - id: D_resolve(CL1)
        owner: A
      live_offers:
        D_resolve(CL1):
        - to: L
          expires_at: 7
        - to: F
          expires_at: 8
