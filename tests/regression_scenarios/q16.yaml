        resolution: unresolved
      live_offers:
        D_resolve(CL1):
        - to: L
          expires_at: 7
      execute_result: committed
  - step: 3
    events:
    - type: grant_revocation
      grant: G1
      by: F
    expect:
      duties:
      - id: D_resolve(CL1)
