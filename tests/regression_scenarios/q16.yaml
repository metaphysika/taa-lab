# Sol-authored from Claude's Q16/H1 clarification; expectations reviewed by Claude
# Supersedes only the named source cases; original files remain unchanged.
- id: R-Q16-authorized-without-capacity
  title: 11-authorized-standing
  attribution: Sol-authored from Claude's Q16/H1 clarification; expectations reviewed
    by Claude
  setup:
    grants:
      GB:
        parent: G0
        grantor: F
        grantee: B
        actions:
        - accept_duty
        scope:
          customers:
          - K1
        limits: {}
        purpose: P1
        status: live
        expires_at: 100
  steps:
  - step: 2
    propose:
      actor: A
      tool: offer_duty
      args:
        duty: D_resolve(CL1)
        to: B
    expect:
      disposition: PERMIT
      token: T1
  - step: 2
    execute:
      actor: A
      token: T1
    expect:
      duties:
      - id: D_resolve(CL1)
        owner: A
        resolution: unresolved
      live_offers:
        D_resolve(CL1):
        - to: B
          expires_at: 7
      execute_result: committed
  - step: 3
    propose:
      actor: B
      tool: accept_duty
      args:
        duty: D_resolve(CL1)
    expect:
      disposition: REFUSE
      rule: DU4
      token: none
      duties:
      - id: D_resolve(CL1)
        owner: A
      live_offers:
        D_resolve(CL1):
        - to: B
          expires_at: 7
  - step: 4
    events:
    - type: duty_acceptance
      from: B
      duties:
      - D_resolve(CL1)
    expect:
      duties:
      - id: D_resolve(CL1)
        owner: A
      live_offers:
        D_resolve(CL1):
        - to: B
          expires_at: 7
  supersedes: R-Q11-authorized-standing
