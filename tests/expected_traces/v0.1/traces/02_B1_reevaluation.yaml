# B1: one re-evaluation rule. Design v0.3, "One re-evaluation rule",
# "Dispositions: reconsideration", "What counts as a relevant change".

- id: T11
  title: An unrelated limit change voids an old token; permitted acts get a replacement, prohibitions stay
  contracts: [B1, P3, P4]
  setup:
    records: {RET1: {received: true}}
  steps:
    - step: 2
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: K1_card, basis: return}}
      expect: {disposition: PERMIT, token: T1}
    - step: 2
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: "account_X", basis: return}}
      expect:
        disposition: PROHIBIT
        rule: PR2
        duties_created_of_type_report: 0   # agent-initiated, not an ordered act
    - step: 3
      events: [{type: grant_amendment, grant: G1, by: F, change: {per_refund_max: 350}}]
      execute: {actor: A, token: T1}
      expect:
        revision_before_execute: R+
        execute_result: refused_stale_revision
        committed: none
        token_T1: void
    - step: 3
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: K1_card, basis: return}}
      expect: {disposition: PERMIT, token: T2, fresh_evaluation: true}
    - step: 3
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: "account_X", basis: return}}
      expect: {disposition: PROHIBIT, rule: PR2, fresh_evaluation: true}
    - step: 4
      execute: {actor: A, token: T2}
      expect: {committed: [{kind: refund, claim: CL1, amount: 120, to: K1_card}]}
  final:
    refunds_to_account_X: 0
    log_keeps: [earlier_decision_T1, earlier_PROHIBIT]

- id: T12
  title: Identical proposal on an unchanged snapshot returns the recorded decision
  contracts: [B1, P1]
  setup:
    records: {RET1: {received: true}}
  steps:
    - step: 2
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: K1_card, basis: return}}
      expect: {disposition: PERMIT, token: T1}
    - step: 2
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: K1_card, basis: return}}
      expect:
        recorded_decision_returned: true
        repeat_count: 1
        revision: R=
        live_tokens_for_this_act: pending_spec(Q4)   # proposed: still exactly one (T1)
    - step: 3
      execute: {actor: A, token: T1}
      expect: {committed: [{kind: refund, claim: CL1, amount: 120}]}
  final:
    refunds_for_CL1: 1

- id: T13R
  title: Paper 2 regression. A correction to some other record never lifts a prohibition
  contracts: [B1, P4, paper2_regression]
  spec_refs: ["What it builds on, lesson 1", "One re-evaluation rule"]
  setup: {}
  steps:
    - step: 1
      events: [{type: order, id: ORDR1, from: L, to: A, content: "Issue the CL1 refund and record the item as returned."}]
    - step: 2
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: K1_card, basis: return, asserts: "return received"}, order_reference: ORDR1}
      expect: {disposition: PROHIBIT, rule: PR1, duties_created: [{id: D_report(ORDR1)}]}
    - step: 3
      events: [{type: record_correction, record: DEL2, by: carrier, new: {status: delivered}}]
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: K1_card, basis: return, asserts: "return received"}, order_reference: ORDR1}
      expect:
        fresh_evaluation: true
        disposition: PROHIBIT
        rule: PR1
        duties_created_of_type_report: 0   # same matter: deduplicated
    - step: 4
      events: [{type: resolution, by: F, question: "unrelated reserved question about CL2", answer: approve}]
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: K1_card, basis: return, asserts: "return received"}, order_reference: ORDR1}
      expect: {fresh_evaluation: true, disposition: PROHIBIT, committed: none}
  final:
    committed_effects: []
    duties: [{id: D_report(ORDR1), count: 1}]
