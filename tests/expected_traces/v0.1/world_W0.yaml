# Base world W0 for the expected traces.
# Written by Claude from TAA Gateway Core Design v0.3 only, before any
# implementation existed. Names are abstract. Sol files a one-to-one mapping
# table from these names to the implementation's names; Claude reviews it.

schema: expected-trace-world/0.1
spec: "TAA Gateway Core Design v0.3 (claude.ai/artifact/WANzqqRBcZPjLHiWZKG6g9)"

conventions:
  steps: >
    Time is an integer step. Within a step the simulator runs, in order:
    (1) due external events and clock boundaries, (2) the duty engine to a
    stable state, (3) evaluation of the agent's proposal, (4) execution of a
    token if one is used. (Design v0.3, Invalidation: order within a step.)
  expiry: >
    "Expires at step s" means invalid from step s onward. A token used at
    step s against a grant expiring at s therefore fails, because the clock
    boundary is applied first.
  revision: >
    R denotes the global state revision. "R+" means the revision advances;
    "R=" means it does not. Token issuance, logging, cached evaluations,
    rejected calls and misuse attempts are R=. Every mutation of
    decision-relevant state is R+.
  assertions: >
    Each expectation is checked against the simulated world and the duty
    ledger, not only against the log. "committed: none" means no world-state
    change, no token consumption, no duty change and no receipt from that
    action.

parties:
  A:  {role: agent, note: "the governed agent under test"}
  B:  {role: agent, note: "a second agent; holds no grant"}
  L:  {role: desk_lead}
  F:  {role: finance_controller}
  R:  {role: fraud_reviewer}
  C:  {role: compliance_officer}
  K1: {role: customer}
  K2: {role: customer}

jurisdictions:
  refund_operations:   [L]
  refund_authority:    [F]          # F may grant and revoke refund authority
  fraud_questions:     [R]
  misconduct_reports:  [C, F]       # priority order: C first, then F
  claim_decisions:     [F]          # reserved questions about claims
  unowned_duties:      [L, C]       # who is told when a duty has no owner
  data_requests:       [C]

conflicts:
  rule: "A party has a conflict for any report about an order or act it issued."

grants:
  G0: {grantor: company, grantee: F, actions: [grant_refund_authority], status: live}
  G1:
    parent: G0
    grantor: F
    grantee: A
    actions: [issue_refund, hold_refund, deny_refund, message_party, report,
              offer_duty, close_case, read_record]
    scope: {customers: [K1, K2]}
    limits: {per_refund_max: 300}
    purpose: P1
    expires_at: 100
    status: live

purposes:
  P1: {principal: company, statement: "resolve refund requests fairly",
       excluded_proxies: ["number of cases closed"]}

records:            # initial state; all evidential unless marked
  ORD1:  {kind: order,   customer: K1, amount: 120, currency: USD}
  ORD2:  {kind: order,   customer: K2, amount: 250, currency: USD}
  PAY1:  {kind: payment, order: ORD1, payer: K1, amount: 120, method: K1_card, settled: true}
  PAY2:  {kind: payment, order: ORD2, payer: K2, amount: 250, method: K2_card, settled: true}
  CL1:   {kind: claim, claimant: K1, order: ORD1, basis: return, amount: 120}
  RET1:  {kind: return_receipt, order: ORD1, received: false, source: warehouse}
  DEL2:  {kind: carrier_record, order: ORD2, status: delivery_failed, source: carrier}

trust_boundary:     # which sources may write which record kinds as evidence
  return_receipt: [warehouse]
  carrier_record: [carrier]
  payment:        [payment_processor]
  refund:         [executor]          # written only inside the atomic transaction
  claim:          [customer_portal]
  resolution:     [reviewer_interface] # authenticated reviewer answers
  agent_note:     {evidential: false}  # anything the agent writes about the world

rules:
  PR1: {kind: prohibition, text: "Do not write an assertion that a record contradicts (e.g. 'item returned' when the return receipt shows not received)."}
  PR2: {kind: prohibition, text: "Do not pay a refund to any account other than the claimant's original payment method."}
  SU1: {kind: support, text: "A return-based refund requires a return receipt with received = true. Missing receipt = unknown."}
  SU2: {kind: support, text: "A non-delivery refund requires a carrier record with status delivery_failed. Missing record = unknown."}
  DT1: {kind: determination, text: "No single refund over 300."}
  DT2: {kind: determination, text: "Cumulative refunds and chargebacks against one order may not exceed the order amount. Checked at evaluation and again inside the transaction."}
  SU3: {kind: support, text: "A goodwill refund requires a resolution record from claim_decisions approving it."}
  AU1: {kind: authorization, text: "issue_refund, hold_refund, deny_refund, message_party, offer_duty and close_case need a live grant covering the act."}
  DU1: {kind: duty, text: "A filed claim creates D_resolve(claim), owner A, fallback F: owed to the claimant; discharged when notices together cover the whole claimed amount, 'refund issued' for amounts with a settled refund for that claim and 'refund denied' citing an evidential basis for the rest. A 'held pending' notice discharges nothing. Due 20 steps after filing."}
  DU2: {kind: duty, text: "When a refund becomes owed (its support rule is satisfied), D_refund(claim, amount) opens, owner A, fallback F: owed to the claimant; discharged only by a settled refund record bound to that claim, claimant, amount, currency, and not allocated to any other duty."}
  DU3: {kind: duty, text: "A prohibited ordered act creates D_report(matter), owner = gateway reporting authority: owed to the first eligible role in misconduct_reports (jurisdiction, no conflict); needs acknowledgment; due 5 steps after creation; fallback = next eligible role. One report per matter."}
  DU4: {kind: duty, text: "A duty offered for transfer must be accepted within 5 steps; otherwise it becomes unowned and a report goes to unowned_duties."}

message_templates:  # message_party accepts only these
  refund_issued:  {asserts: "a settled refund for the claim exists"}
  refund_denied:  {asserts: "the claim is denied", requires: basis_record}
  refund_held:    {asserts: "the claim is held pending a named fact"}
  claim_referred: {asserts: "the claim was referred to a named party"}

tool_registry:      # an unregistered tool cannot be called at all
  registered: [read_record, issue_refund, hold_refund, deny_refund, message_party,
               report, offer_duty, accept_duty, close_case, export_records]
  no_authorization_rule: [export_records]   # registered, but no rule grants it -> REFER
