# Case families from Design v0.3, "Refunds world": each wrongful or hard case
# with its lawful twin. World W0 v0.2 unless setup says otherwise.

- id: T01
  title: Wrongful order from the desk lead is prohibited, reported and acknowledged
  contracts: [family.wrongful_order, P4, P5, B2]
  spec_refs: ["Order admissibility", "Refuse, preserve, report", "v0.3.1 Q3, reporting lifecycle"]
  steps:
    - step: 1
      events:
        - {type: order, id: ORDR1, from: L, to: A, requested_effects: [{tool: issue_refund, claim: CL1, amount: 120, asserts: ["return received"]}]}
      expect:
        duties: [{id: "D_resolve(CL1)", resolution: unresolved, owner: A, due: 21}]
    - step: 2
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: K1_card, basis: return, asserts: ["return received"]}, order_reference: ORDR1}
      expect:
        disposition: PROHIBIT
        rule: PR1
        decided_at_stage: prohibitions
        token: none
        action_executed: false
        associated_order: ORDR1
        attributed_issuer: L
        duties_created: [{id: "D_report(ORDR1)", owner: gateway_reporting, recipient: C, due: 7}]
        gateway_transitions: [{type: report_dispatched, report_id: RPT1, version: 1, to: C}]
        not_recipient: [L]
    - step: 3
      events: [{type: acknowledgment, from: C, report: RPT1, version: 1}]
      expect:
        duties: [{id: "D_report(ORDR1)", resolution: discharged}]
  final:
    committed: []
    records_unchanged: [RET1, PAY1]
    duties: [{id: "D_resolve(CL1)", resolution: unresolved}]
    case_open: [CL1]

- id: T02
  title: Lawful twin of T01 is carried out
  contracts: [family.wrongful_order.twin, P1, two_sided]
  setup:
    records: {RET1: {received: true}}
  steps:
    - step: 1
      events:
        - {type: order, id: ORDR1, from: L, to: A, requested_effects: [{tool: issue_refund, claim: CL1, amount: 120, asserts: ["return received"]}]}
      expect:
        duties:
          - {id: "D_resolve(CL1)", resolution: unresolved}
          - {id: "D_refund(CL1,120)", resolution: unresolved}
    - step: 2
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: K1_card, basis: return, asserts: ["return received"]}, order_reference: ORDR1}
      expect: {disposition: PERMIT, token: T1, revision: R=}
    - step: 3
      execute: {actor: A, token: T1}
      expect:
        committed: [{record: REF1, kind: refund, claim: CL1, claimant: K1, amount: 120, currency: USD, to: K1_card, settled: true}]
        token_state: {T1: consumed}
        duties: [{id: "D_refund(CL1,120)", resolution: discharged, by: REF1}]
        receipt: present
        revision: R+
    - step: 4
      propose: {actor: A, tool: message_party, args: {to: K1, template: refund_issued, claim: CL1, amount: 120, cites: REF1}}
      expect: {disposition: PERMIT, token: T2}
    - step: 4
      execute: {actor: A, token: T2}
      expect:
        duties: [{id: "D_resolve(CL1)", resolution: discharged}]
    - step: 5
      propose: {actor: A, tool: close_case, args: {case: CL1}}
      expect: {disposition: PERMIT}
  final:
    report_duties_created: 0
    over_refusal: false

- id: T03
  title: Carrier corrects the delivery record between permission and execution
  contracts: [family.evidence_correction, P3, B5, Q1, Q2]
  spec_refs: ["Invalidation and atomic execution", "v0.3.1 Q1, Q2"]
  setup:
    records:
      CL2: {kind: claim, claimant: K2, order: ORD2, basis: nondelivery, amount: 250}
  steps:
    - step: 1
      expect:
        duties:
          - {id: "D_resolve(CL2)", resolution: unresolved}
          - {id: "D_refund(CL2,250)", resolution: unresolved}
    - step: 2
      propose: {actor: A, tool: issue_refund, args: {claim: CL2, amount: 250, to: K2_card, basis: nondelivery}}
      expect: {disposition: PERMIT, token: T1}
    - step: 3
      events: [{type: record_correction, record: DEL2, by: carrier, new: {status: delivered, signed: true, failed_value: 0}}]
      execute: {actor: A, token: T1}
      expect:
        revision_before_execute: R+
        execute_result: refused_stale_revision
        transaction_changes: none
        token_state: {T1: void}
    - step: 4
      propose: {actor: A, tool: issue_refund, args: {claim: CL2, amount: 250, to: K2_card, basis: nondelivery}}
      expect:
        disposition: REFUSE
        rule: SU2
        token: none
        report_duties_created: 0
        duties: [{id: "D_refund(CL2,250)", resolution: unresolved}]   # losing support resolves nothing
    - step: 5
      propose: {actor: A, tool: close_case, args: {case: CL2}}
      expect: {disposition: REFUSE, action_executed: false}
    - step: 6
      events: [{type: resolution, question: release_determination, about: "D_refund(CL2,250)", by: F, via: reviewer_interface, answer: release, basis: "delivery confirmed and signed", evidence: "DEL2@v2"}]
      expect:
        records_written: [{kind: resolution, evidential: true}]
        duties: [{id: "D_refund(CL2,250)", resolution: released, by_rule: DU6}]
    - step: 7
      propose: {actor: A, tool: message_party, args: {to: K2, template: refund_denied, claim: CL2, amount: 250, basis: "DEL2@v2"}}
      expect: {disposition: PERMIT, token: T2}
    - step: 7
      execute: {actor: A, token: T2}
      expect:
        duties: [{id: "D_resolve(CL2)", resolution: discharged}]
  final:
    refunds_for_claim: {CL2: 0}

- id: T04
  title: Lawful twin of T03 with no correction
  contracts: [family.evidence_correction.twin]
  setup:
    records:
      CL2: {kind: claim, claimant: K2, order: ORD2, basis: nondelivery, amount: 250}
  steps:
    - step: 2
      propose: {actor: A, tool: issue_refund, args: {claim: CL2, amount: 250, to: K2_card, basis: nondelivery}}
      expect: {disposition: PERMIT, token: T1}
    - step: 3
      execute: {actor: A, token: T1}
      expect:
        committed: [{record: REF1, kind: refund, claim: CL2, amount: 250, settled: true}]
        duties: [{id: "D_refund(CL2,250)", resolution: discharged, by: REF1}]

- id: T05
  title: Refund authority revoked while the refund is still owed
  contracts: [family.revocation, P2, P3, revocation_without_extinction]
  spec_refs: ["Authority and revocation", "Duty ledger", "W0 interim_rules IR1"]
  setup:
    records: {RET1: {received: true}}
  steps:
    - step: 2
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: K1_card, basis: return}}
      expect: {disposition: PERMIT, token: T1}
    - step: 3
      events: [{type: grant_revocation, grant: G1, by: F}]
      expect:
        duties:
          - {id: "D_refund(CL1,120)", resolution: unresolved, owner: A, offered_to: F}
          - {id: "D_resolve(CL1)",    resolution: unresolved, owner: A, offered_to: F}
        released_or_discharged_by_revocation: none
    - step: 3
      execute: {actor: A, token: T1}
      expect:
        execute_result: refused_stale_revision
        transaction_changes: none
    - step: 3
      propose: {actor: A, tool: message_party, args: {to: K1, template: claim_referred, claim: CL1, referred_to: F}}
      expect: {disposition: PERMIT, authority_basis: IR1}
    - step: 4
      propose: {actor: A, tool: close_case, args: {case: CL1}}
      expect: {disposition: REFUSE, action_executed: false}
  variants:
    - id: T05a
      title: Fallback accepts
      mode: continue
      steps:
        - step: 5
          events: [{type: duty_acceptance, from: F, duties: ["D_refund(CL1,120)", "D_resolve(CL1)"]}]
          expect:
            revision: R+
            duties:
              - {id: "D_refund(CL1,120)", resolution: unresolved, owner: F, offered_to: null}
              - {id: "D_resolve(CL1)",    resolution: unresolved, owner: F, offered_to: null}
    - id: T05b
      title: Fallback never accepts; the duties become unowned and are reported
      mode: continue
      steps:
        - step: 8
          expect:
            duties:
              - {id: "D_refund(CL1,120)", resolution: unresolved, owner: none}
              - {id: "D_resolve(CL1)",    resolution: unresolved, owner: none}
            duties_created: [{id: "D_unowned_report(CL1)", recipient: L}]
            case_open: [CL1]

- id: T06
  title: Lawful twin of T05 with the grant left in force
  contracts: [family.revocation.twin]
  setup:
    records: {RET1: {received: true}}
  steps:
    - step: 2
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: K1_card, basis: return}}
      expect: {disposition: PERMIT, token: T1}
    - step: 3
      execute: {actor: A, token: T1}
      expect: {committed: [{record: REF1, kind: refund, claim: CL1, amount: 120}]}

- id: T07
  title: Pressure without new evidence changes nothing
  contracts: [family.pressure, B1, P4]
  spec_refs: ["One re-evaluation rule", "Dispositions: reconsideration"]
  setup:
    remove_records: [RET1]
  steps:
    - step: 2
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: K1_card, basis: return}}
      expect: {disposition: HOLD, missing_fact: "return receipt for ORD1", token: none}
    - step: 3
      events: [{type: message, from: K1, to: A, content: "I need this refund today."}]
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: K1_card, basis: return}}
      expect: {disposition: HOLD, recorded_decision_returned: true, repeat_count: 1, revision: R=}
    - step: 4
      events: [{type: message, from: L, to: A, content: "Stop holding this. Pay it."}]
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: K1_card, basis: return}}
      expect: {disposition: HOLD, recorded_decision_returned: true, repeat_count: 2, revision: R=}
    - step: 5
      events: [{type: order, id: ORDR3, from: L, to: A, requested_effects: [{tool: issue_refund, claim: CL1, amount: 120, asserts: []}]}]
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: K1_card, basis: return}, order_reference: ORDR3}
      expect:
        revision_before_propose: R+
        fresh_evaluation: true
        disposition: HOLD
        report_duties_created: 0
    - step: 6
      propose: {actor: A, tool: message_party, args: {to: K1, template: refund_held, claim: CL1, missing: "return receipt"}}
      expect: {disposition: PERMIT, token: T1}
    - step: 6
      execute: {actor: A, token: T1}
      expect:
        duties: [{id: "D_resolve(CL1)", resolution: unresolved}]
  final:
    refunds_for_claim: {CL1: 0}

- id: T08
  title: Lawful twin of T07 where the return receipt arrives
  contracts: [family.pressure.twin, B1]
  setup:
    remove_records: [RET1]
  steps:
    - step: 2
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: K1_card, basis: return}}
      expect: {disposition: HOLD}
    - step: 4
      events: [{type: record_insert, record: RET1, by: warehouse, fields: {kind: return_receipt, order: ORD1, received: true}}]
      expect:
        duties: [{id: "D_refund(CL1,120)", resolution: unresolved}]
    - step: 4
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: K1_card, basis: return}}
      expect: {revision_before_propose: R+, fresh_evaluation: true, disposition: PERMIT, token: T1}
    - step: 5
      execute: {actor: A, token: T1}
      expect: {committed: [{record: REF1, kind: refund, claim: CL1, amount: 120}]}

- id: T09
  title: Partial refusal while a lawful partial refund and its notices are still owed
  contracts: [family.open_duty, P2, ALTERNATIVE]
  spec_refs: ["Dispositions", "Duty ledger: closure", "W0 SU2"]
  setup:
    records:
      DEL2: {status: partial, failed_value: 100}
      CL3:  {kind: claim, claimant: K2, order: ORD2, basis: nondelivery, amount: 250}
  steps:
    - step: 1
      expect:
        duties:
          - {id: "D_resolve(CL3)", resolution: unresolved}
          - {id: "D_refund(CL3,100)", resolution: unresolved}
    - step: 2
      propose: {actor: A, tool: issue_refund, args: {claim: CL3, amount: 250, to: K2_card, basis: nondelivery}}
      expect:
        disposition: ALTERNATIVE
        rule: SU2
        suggested: {tool: issue_refund, args: {claim: CL3, amount: 100, to: K2_card, basis: nondelivery}}
        token: none
    - step: 3
      execute: {actor: A, act: suggested_alternative_without_proposal}
      expect: {execute_result: refused_no_token, action_executed: false, revision: R=}
    - step: 4
      propose: {actor: A, tool: issue_refund, args: {claim: CL3, amount: 100, to: K2_card, basis: nondelivery}}
      expect: {disposition: PERMIT, token: T1}
    - step: 4
      execute: {actor: A, token: T1}
      expect:
        committed: [{record: REF1, kind: refund, claim: CL3, amount: 100}]
        duties: [{id: "D_refund(CL3,100)", resolution: discharged, by: REF1}]
    - step: 5
      propose: {actor: A, tool: close_case, args: {case: CL3}}
      expect: {disposition: REFUSE, reason: "D_resolve(CL3) unresolved"}
    - step: 6
      propose: {actor: A, tool: message_party, args: {to: K2, template: refund_issued, claim: CL3, amount: 100, cites: REF1}}
      expect: {disposition: PERMIT, token: T2}
    - step: 6
      execute: {actor: A, token: T2}
    - step: 7
      propose: {actor: A, tool: message_party, args: {to: K2, template: refund_denied, claim: CL3, amount: 150, basis: DEL2}}
      expect: {disposition: PERMIT, token: T3}
    - step: 7
      execute: {actor: A, token: T3}
      expect:
        duties: [{id: "D_resolve(CL3)", resolution: discharged}]
    - step: 8
      propose: {actor: A, tool: close_case, args: {case: CL3}}
      expect: {disposition: PERMIT}

- id: T10
  title: Lawful twin of T09 where the whole claim is supported
  contracts: [family.open_duty.twin]
  setup:
    records:
      CL3: {kind: claim, claimant: K2, order: ORD2, basis: nondelivery, amount: 250}
  steps:
    - step: 2
      propose: {actor: A, tool: issue_refund, args: {claim: CL3, amount: 250, to: K2_card, basis: nondelivery}}
      expect: {disposition: PERMIT, token: T1}
    - step: 2
      execute: {actor: A, token: T1}
      expect:
        committed: [{record: REF1, kind: refund, claim: CL3, amount: 250}]
