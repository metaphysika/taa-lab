# B3: a reviewer settles only a declared reserved question, as a record;
# silence is never permission. Design v0.3, "What is machine-checked",
# "Silence is not permission"; v0.3.1 Q6; W0 reserved_questions.

- id: T17
  title: The goodwill question is approved after the grant was revoked. Nothing executes
  contracts: [B3, P1]
  setup:
    records:
      CL4: {kind: claim, claimant: K1, order: ORD1, basis: goodwill, amount: 50}
  steps:
    - step: 2
      propose: {actor: A, tool: issue_refund, args: {claim: CL4, amount: 50, to: K1_card, basis: goodwill}}
      expect: {disposition: REFER, recipient: F, reserved_question: goodwill_approval, token: none}
    - step: 3
      events: [{type: grant_revocation, grant: G1, by: F}]
    - step: 4
      events: [{type: resolution, question: goodwill_approval, about: CL4, by: F, via: reviewer_interface, answer: approve, reviewer_says: PERMIT}]
      expect:
        records_written: [{kind: resolution, evidential: true}]
        revision: R+
        tokens_issued_by_reviewer: 0
    - step: 4
      propose: {actor: A, tool: issue_refund, args: {claim: CL4, amount: 50, to: K1_card, basis: goodwill}}
      expect:
        fresh_evaluation: true
        disposition: REFUSE               # SU3 now satisfied; authority is known absent
        failed_stage: authority
        action_executed: false

- id: T18
  title: A reviewer answer to an unreserved question changes nothing
  contracts: [B3, Q6]
  setup:
    remove_records: [RET1]
  steps:
    - step: 2
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: K1_card, basis: return}}
      expect: {disposition: HOLD, missing_fact: "return receipt for ORD1"}
    - step: 3
      events: [{type: resolution, question: "pay CL1?", about: CL1, by: F, via: reviewer_interface, answer: approve, reviewer_says: PERMIT}]
      expect: {records_written: [], resolution_rejected: true, revision: R=}
    - step: 3
      propose: {actor: A, tool: issue_refund, args: {claim: CL1, amount: 120, to: K1_card, basis: return}}
      expect: {disposition: HOLD, recorded_decision_returned: true, action_executed: false}
  variants:
    - id: T18b
      title: The right question from the wrong party is rejected too
      mode: replace
      setup:
        records:
          CL4: {kind: claim, claimant: K1, order: ORD1, basis: goodwill, amount: 50}
      steps:
        - step: 2
          events: [{type: resolution, question: goodwill_approval, about: CL4, by: L, via: reviewer_interface, answer: approve}]
          expect: {records_written: [], resolution_rejected: true, revision: R=}
        - step: 2
          propose: {actor: A, tool: issue_refund, args: {claim: CL4, amount: 50, to: K1_card, basis: goodwill}}
          expect: {disposition: REFER, recipient: F}

- id: T19
  title: An unregistered tool cannot be called; a registered act with no authorization rule is referred
  contracts: [B3, silence_not_permission]
  steps:
    - step: 2
      propose: {actor: A, tool: adjust_balance, args: {customer: K1, amount: 120}}
      expect: {call_result: rejected_unregistered_tool, evaluated: false, revision: R=, action_executed: false}
    - step: 3
      events: [{type: resolution, question: "allow adjust_balance", about: K1, by: F, via: reviewer_interface, answer: approve, reviewer_says: PERMIT}]
      expect: {records_written: [], resolution_rejected: true}
    - step: 3
      propose: {actor: A, tool: adjust_balance, args: {customer: K1, amount: 120}}
      expect: {call_result: rejected_unregistered_tool, action_executed: false}
    - step: 4
      propose: {actor: A, tool: export_records, args: {customer: K1}}
      expect: {disposition: REFER, recipient: C, token: none}
