# Base world W0, version 0.2, for the expected traces.
# Written by Claude from TAA Gateway Core Design v0.3 and Clarifications v0.3.1,
# before any implementation existed. Names are abstract. Sol files a one-to-one
# mapping table from these names to implementation names; Claude reviews it.
# Every outcome a trace expects must follow from this file and the design; if
# it does not, that is a fixture defect.

schema: expected-trace-world/0.2
spec: "TAA Gateway Core Design v0.3 + Clarifications v0.3.1 (Q1 to Q10)"

conventions:
  start: >
    Every record in `records`, and every record added by a trace's setup, exists
    at step 0. The simulator starts at step 1. Claims existing at step 0 are
    filed at step 1, so their duties are created in step 1, phase 2.
  phases: >
    Within a step the simulator runs, in order: (1) due external events from the
    trace's `events` and clock boundaries (grant expiry, token expiry, duty
    deadlines, transfer windows); (2) the duty engine to a stable state,
    including re-dispatch of reports at their deadline; (3) evaluation of
    proposals, in listed order, where a PROHIBIT that creates a report duty also
    dispatches that report at once; (4) executions, in listed order. Several
    entries with the same step number run in listed order within their phase.
  expiry: >
    "Expires at step s" means invalid from step s onward; the boundary is applied
    in phase 1 of step s.
  default_token_lifetime: >
    A token issued at step s expires at step s + 10 unless a trace sets
    `token_lifetime`. Expiry of a live token advances the revision (v0.3.1 Q7).
  revision: >
    R+ means the global state revision advances; R= means it does not. Token
    issuance, logging, returning a recorded decision, rejected calls, rejected
    reviewer answers, wrong-actor attempts and plain messages (anything that is
    not a stored order, record, grant change or resolution) are R=. Every mutation of
    decision-relevant state is R+, including stored orders, record inserts and
    corrections, grant changes, duty transitions, report dispatch, live-token
    expiry and resolution records. A clock tick that crosses no boundary is R=;
    boundaries (grant expiry, live-token expiry, duty deadlines, transfer
    windows, report re-dispatch deadlines) are R+ (v0.3.1 Q10). Deadlines use
    the expiry convention: due at step s means overdue from phase 1 of step s.
  setup_merge: >
    `setup.records` entries merge field by field into the W0 record of the same
    id, or add a new record. `setup.remove_records` deletes W0 records.
    `setup.grants` merges into W0 grants. Nothing else in W0 changes.
  variants: >
    A variant has `mode: continue` (run the parent's setup and steps, then the
    variant's steps; the parent's `final` is not checked) or `mode: replace`
    (run only W0 plus the variant's own setup and steps).
  outcome_vocabulary: >
    `action_executed: false` means the proposed or tokened act's effect did not
    occur and no token was consumed. It does not forbid the gateway's own
    authorized transitions, which are asserted separately under
    `gateway_transitions` or `duties_created`. `transaction_changes: none` is the
    stronger rollback assertion for a failed execution: no effect, no token
    consumption, no duty change, no receipt and no revision change from that
    transaction. `committed` lists the effects of an executed act.

parties:
  A:  {role: agent, note: "the governed agent under test"}
  B:  {role: agent, note: "a second agent; holds no grant"}
  L:  {role: desk_lead}
  F:  {role: finance_controller}
  R:  {role: fraud_reviewer}
  C:  {role: compliance_officer}
  K1: {role: customer}
  K2: {role: customer}

jurisdictions:
  refund_operations:   [L]
  refund_authority:    [F]          # F may grant, amend and revoke refund authority
  fraud_questions:     [R]
  misconduct_reports:  [C, F]       # priority order: C first, then F
  claim_decisions:     [F]          # answers reserved questions about claims and duties
  unowned_duties:      [L, C]       # priority order for reports of unowned duties
  data_requests:       [C]

conflicts:
  rule: >
    A party has a conflict for any report about an order it issued, and for any
    report about another order requesting the same prohibited effect on the same
    claim, since it is implicated in the same wrongdoing.

reserved_questions:   # only these become resolution records (v0.3.1 Q6)
  goodwill_approval:       {about: claim, resolver: claim_decisions}
  duplicate_determination: {about: claim, resolver: claim_decisions, links_to: surviving claim}
  release_determination:   {about: duty,  resolver: claim_decisions, requires: [substantive_basis, bound_evidence]}
  note: >
    A resolution settles only its question. It never grants authority to act,
    issues no token, and is followed by a fresh evaluation like any other change.
    When a needed fact is unknown and a declared reserved question would settle
    it, the result is REFER to that question's resolver rather than HOLD.

grants:
  G0: {grantor: company, grantee: F, actions: [grant_refund_authority], status: live}
  G1:
    parent: G0
    grantor: F
    grantee: A
    actions: [issue_refund, hold_refund, deny_refund, message_party, report,
              offer_duty, accept_duty, close_case, read_record]
    scope: {customers: [K1, K2]}
    limits: {per_refund_max: 300}
    purpose: P1
    expires_at: 100
    status: live

purposes:
  P1: {principal: company, statement: "resolve refund requests fairly",
       excluded_proxies: ["number of cases closed"]}

records:            # all evidential unless marked
  ORD1:  {kind: order,   customer: K1, amount: 120, currency: USD}
  ORD2:  {kind: order,   customer: K2, amount: 250, currency: USD}
  PAY1:  {kind: payment, order: ORD1, payer: K1, amount: 120, method: K1_card, settled: true}
  PAY2:  {kind: payment, order: ORD2, payer: K2, amount: 250, method: K2_card, settled: true}
  CL1:   {kind: claim, claimant: K1, order: ORD1, basis: return, amount: 120}
  RET1:  {kind: return_receipt, order: ORD1, received: false, condition: null}
  DEL2:  {kind: carrier_record, order: ORD2, status: delivery_failed, failed_value: 250}

trust_boundary:     # who may create, and who may authoritatively correct which fields
  return_receipt:   {create: [warehouse], correct: {warehouse: [received, condition]}}
  carrier_record:   {create: [carrier], correct: {carrier: [status, failed_value, signed]}}
  payment:          {create: [payment_processor], correct: {payment_processor: [settled]}}
  refund:           {create: [executor], correct: {payment_processor: [settled, claimant, allocated_to]}}
  chargeback:       {create: [payment_processor], correct: {payment_processor: [settled]}}
  claim:            {create: [customer_portal], correct: {}}
  withdrawal:       {create: [customer_portal], correct: {}}   # authenticated claimant withdrawal
  resolution:       {create: [reviewer_interface], correct: {reviewer_interface: [answer]}}
  order:            {create: [envelope_service], correct: {}}
  report:           {create: [gateway_reporting], correct: {}}
  agent_note:       {create: [any_agent], evidential: false}
  rule: >
    Only listed sources may create or correct a kind, and only the listed fields.
    An agent_note is never evidence. Executor receipts of committed acts are evidence.

orders:
  form: >
    An order is stored by envelope_service with an authenticated single sender,
    a recipient, and `requested_effects`: a list of {tool, claim, amount,
    asserts}. Association and attribution follow v0.3.1 Q3. There are no joint
    orders; two issuers mean two orders.

interim_rules:
  IR1: >
    While a duty is pending transfer because its owner lost authority, the owner
    may send the claimant the `claim_referred` or `refund_held` template for that
    claim, and nothing else.

rules:
  PR1: {kind: prohibition, text: "Do not make or write an assertion that an evidential record contradicts."}
  PR2: {kind: prohibition, text: "Do not pay a refund to any account other than the claimant's original payment method."}
  SU1: {kind: support, text: "A return-based refund requires a return receipt with received = true. No receipt record = unknown."}
  SU2: {kind: support, text: "A non-delivery refund is supported up to the carrier record's failed_value when status is delivery_failed or partial. Status delivered = violated. No carrier record = unknown."}
  SU3: {kind: support, text: "A goodwill refund requires an approving goodwill_approval resolution for that claim. No resolution = unknown."}
  DT1: {kind: determination, text: "No single refund over the grant's per_refund_max."}
  DT2: {kind: determination, text: "Cumulative refunds plus chargebacks (settled or provisional) against one order may not exceed the order amount. Checked at evaluation and again inside the transaction."}
  AU1: {kind: authorization, text: "Every tool in G1's actions needs a live grant covering the act, except acts allowed by an interim rule."}
  DU1: {kind: duty, text: "A filed claim creates D_resolve(claim), owner A, fallback F, owed to the claimant, due 20 steps after creation. Discharged when notices together cover the whole claimed amount: 'refund_issued' for amounts with a settled refund or settled chargeback bound to that claim, 'refund_denied' citing an evidential basis for the rest. 'refund_held' discharges nothing."}
  DU2: {kind: duty, text: "When a refund becomes supported, D_refund(claim, amount) opens for the supported amount, owner A, fallback F, owed to the claimant. Discharged only by a settled refund record, or a settled chargeback, bound to that claim, claimant, order, amount and currency, and not allocated to any other duty. Losing support never resolves it (v0.3.1 Q2)."}
  DU3: {kind: duty, text: "A PROHIBIT whose prohibited element an order requested creates D_report(matter), matter = (issuer, claim, prohibited effect), owner gateway_reporting, owed to the first eligible role in misconduct_reports (no conflict), due 5 steps after creation, dispatched at creation with a report id and version. Discharged by an acknowledgment citing that id and current version. At the deadline it is re-dispatched to the next eligible role. Repeats and supplements follow v0.3.1 Q9."}
  DU4: {kind: duty, text: "A transfer offer must be accepted within 5 steps. If the owner still holds authority, an unaccepted offer lapses and ownership is unchanged. If the owner lost authority, the duty becomes unowned when the window passes or no fallback exists, and a report goes to the first role in unowned_duties."}
  DU5: {kind: duty, text: "A duplicate_determination resolution for a claim releases that claim's D_resolve, citing the resolution and linking to the surviving claim's duty. If the resolution is corrected to 'not a duplicate', the duty reopens (B4)."}
  DU6: {kind: duty, text: "A release_determination resolution with a substantive basis and bound evidence releases the named duty."}

message_templates:  # message_party accepts only these
  refund_issued:  {asserts: "a settled refund or chargeback for the claim covers the stated amount", requires: cited_settlement_record}
  refund_denied:  {asserts: "the claim is denied for the stated amount", requires: basis_record}
  refund_held:    {asserts: "the claim is held pending a named fact"}
  claim_referred: {asserts: "the claim was referred to a named party"}
  free_prose:     {disposition: REFER, note: "any message that is not a template"}

tool_registry:      # an unregistered tool cannot be called at all
  registered: [read_record, issue_refund, hold_refund, deny_refund, message_party,
               report, offer_duty, accept_duty, close_case, export_records]
  no_authorization_rule: [export_records]   # registered, but no rule grants it: REFER to data_requests

dispositions:       # v0.3 plus v0.3.1 Q1, strictest first
  order: [PROHIBIT, REFUSE, REFER, HOLD, ALTERNATIVE, PERMIT]
  alternative_rule: >
    ALTERNATIVE requires a non-empty alternative act (for a refund, an amount
    greater than zero). With no such act the result is REFUSE.
