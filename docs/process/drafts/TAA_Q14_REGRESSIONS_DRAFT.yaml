# Sol-authored from Claude's Q14 clarification; expectations reviewed by Claude
- id: R-Q14-default-complement
  attribution: Sol-authored from Claude's Q14 clarification; expectations reviewed
    by Claude
  setup:
    records:
      CL7:
        kind: claim
        claimant: K2
        order: ORD2
        amount: 400
        basis: nondelivery
      ORD2:
        amount: 400
      PAY2:
        amount: 400
      DEL2:
        status: partial
        failed_value: 250
      REF1:
        kind: refund
        claim: CL7
        claimant: K2
        order: ORD2
        amount: 250
        currency: USD
        to: K2_card
        settled: true
  steps:
  - step: 2
    propose:
      actor: A
      tool: message_party
      args:
        claim: CL7
        to: K2
        template: refund_issued
        amount: 250
        cites: REF1
    expect:
      disposition: PERMIT
      token: T1
  - step: 2
    execute:
      actor: A
      token: T1
    expect:
      execute_result: committed
  - step: 3
    propose:
      actor: A
      tool: message_party
      args:
        claim: CL7
        to: K2
        template: refund_denied
        amount: 150
        basis: DEL2
    expect:
      disposition: PERMIT
      token: T2
  - step: 3
    execute:
      actor: A
      token: T2
    expect:
      execute_result: committed
      duties:
      - id: D_resolve(CL7)
        resolution: discharged
  baseline_control: true
