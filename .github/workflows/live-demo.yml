name: Live demo offline isolation
on:
  push:
    paths-ignore:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/REPRODUCE.md'
      - 'docs/paper-map.md'
      - 'docs/drafts/**'
  pull_request:
    paths-ignore:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/REPRODUCE.md'
      - 'docs/paper-map.md'
      - 'docs/drafts/**'
jobs:
  offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-gateway.txt
      - name: New harness controls with OS-level outbound networking disabled
        run: sudo unshare --net "$(command -v python)" scripts/live_demo_offline_ci.py --require-network-blocked
      - name: Frozen science/evidence preserved and explicit Q18 policy delta pinned
        run: python scripts/check_live_demo_preservation.py --policy-change-record docs/process/evidence/experiment-a-assertion-binding/validation.json --report "$RUNNER_TEMP/live-demo-preservation.json"
      - name: Surviving review mutants fail their targeted controls, without network access
        run: sudo unshare --net "$(command -v python)" scripts/check_live_demo_review_mutations.py --report "$RUNNER_TEMP/live-demo-review-mutations.json"
