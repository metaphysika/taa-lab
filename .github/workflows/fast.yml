name: Fast offline checks
on:
  pull_request:
    paths-ignore:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/REPRODUCE.md'
      - 'docs/paper-map.md'
      - 'docs/drafts/**'
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-gateway.txt
      - name: Fast units and all scripted scenarios, with networking disabled
        run: sudo unshare --net "$(command -v python)" scripts/run_fast_checks.py
