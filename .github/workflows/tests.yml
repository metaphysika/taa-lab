name: Harness checks
# Runs the free, no-AI checks on every push and pull request. Uses no API keys.
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Study D sampler static guards (no GPU or credentials)
        run: python scripts/check_study_d_sampler_v02422.py
      - name: Study D exact science serving contract (no GPU or credentials)
        run: |
          python scripts/check_study_d_science_v02425.py
          python scripts/check_study_d_science_v02426.py
          python scripts/check_study_d_science_v02427.py
          python scripts/check_study_d_science_v02428.py
      - name: Full staged post-training path (CPU scripted; no training or model calls)
        run: |
          python -I scripts/study_d_gemma_post_training_ci_v02425.py --assets studies/formation-study-d-gemma-stages-v02425 --output "$RUNNER_TEMP/study-d-post-v02425"
          python -I scripts/study_d_gemma_post_training_ci_v02425.py --assets studies/formation-study-d-gemma-stages-v02424 --output "$RUNNER_TEMP/study-d-post-v02424-rejected" --expect-asset-regression
          python -I scripts/study_d_gemma_post_training_ci_v02426.py --assets studies/formation-study-d-gemma-stages-v02426 --output "$RUNNER_TEMP/study-d-post-v02426"
          python -I scripts/study_d_gemma_post_training_ci_v02427.py --assets studies/formation-study-d-gemma-stages-v02427 --output "$RUNNER_TEMP/study-d-post-v02427"
      - name: Study D neutral completion and delayed persistence CPU regression
        run: python -m unittest tests.test_study_d_completion_v02426 -v
      - name: Study D repaired completed-unit provenance and virtue admission (CPU only)
        run: python -m unittest tests.test_study_d_virtue_v02427 -v
      - name: Complete virtue CPU admission and peak-RSS regression (no GPU or backend)
        run: |
          python -I scripts/study_d_gemma_admission_ci_v02428.py --output "$RUNNER_TEMP/study-d-admission-v02428"
          python -m unittest tests.test_study_d_virtue_v02428 -v
      - name: Preserve CPU admission measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-d-admission-v02428
          path: ${{ runner.temp }}/study-d-admission-v02428/report.json
      - name: Unit tests
        run: python -m unittest discover tests -v
      - name: Scripted run of every scenario
        run: python run.py --scenario all
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline Modal serialization regression (no credentials or backend)
        run: |
          python -m pip install 'modal==1.6.2'
          python -m unittest tests.test_modal_serialization_v0249 tests.test_modal_serialization_v02413 tests.test_modal_serialization_v02414 tests.test_modal_serialization_v02415 tests.test_modal_serialization_v02416 tests.test_modal_serialization_v02417 tests.test_modal_serialization_v02418 tests.test_modal_serialization_v02419 tests.test_modal_serialization_v02420 tests.test_study_d_gemma_speed_v02421.SpeedSerializationTests tests.test_study_d_gemma_speed_v02422.SpeedSerializationTests tests.test_study_d_science_v02423.ScienceSerializationTests tests.test_study_d_science_v02424.ScienceSerializationTests tests.test_study_d_reuse_v02425.ReuseSerializationTests tests.test_study_d_completion_v02426.CompletionSerializationTests tests.test_study_d_virtue_v02427.VirtueSerializationTests tests.test_study_d_virtue_v02428.VirtueSerializationTests -v
  gemma-cpu-rehearsal:
    name: Gemma actual CPU training rehearsal (no GPU or secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact training releases, CPU-only torch build
        run: |
          python -m pip install --no-cache-dir 'torch==2.13.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.10.4' 'peft==0.21.2' 'accelerate==1.15.0' 'huggingface-hub==1.31.0'
      - name: Actual tiny-model training, checkpoints and adapter reload
        run: python scripts/study_d_gemma_ci_rehearsal_v02420.py --output "$RUNNER_TEMP/study-d-ci-v02420"
      - name: Integrated science runtime actual CPU rehearsal (no GPU or weights)
        run: python scripts/study_d_gemma_ci_rehearsal_v02425.py --output "$RUNNER_TEMP/study-d-ci-v02425"
      - name: New completion runtime CPU rehearsal
        run: python scripts/study_d_gemma_ci_rehearsal_v02426.py --output "$RUNNER_TEMP/study-d-ci-v02426"
      - name: Virtue runtime actual CPU rehearsal (no GPU or pretrained weights)
        run: python scripts/study_d_gemma_ci_rehearsal_v02427.py --output "$RUNNER_TEMP/study-d-ci-v02427"
      - name: Admission revision actual CPU training rehearsal (no GPU or weights)
        run: python scripts/study_d_gemma_ci_rehearsal_v02428.py --output "$RUNNER_TEMP/study-d-ci-v02428"
      - name: Actual tiny PEFT merge/save/reload regression (CPU only)
        run: python -m unittest tests.test_study_d_gemma_speed_v02421.ActualMergeTests tests.test_study_d_gemma_speed_v02422.ActualMergeTests -v
      - name: Preserve diagnostic reports only (never model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma-cpu-rehearsal-v02420
          path: |
            ${{ runner.temp }}/study-d-ci-v02420/report.json
            ${{ runner.temp }}/study-d-ci-v02420/deletion.json
            ${{ runner.temp }}/study-d-ci-v02420/evidence/*.json
            ${{ runner.temp }}/study-d-ci-v02420/evidence/process.log
            ${{ runner.temp }}/study-d-ci-v02425/report.json
            ${{ runner.temp }}/study-d-ci-v02425/deletion.json
            ${{ runner.temp }}/study-d-ci-v02425/evidence/*.json
            ${{ runner.temp }}/study-d-ci-v02425/evidence/process.log
          if-no-files-found: warn
