name: Formation Python 3.9 checks
on: [push, pull_request]
jobs:
  formation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Free formation fixtures only
        run: python -m unittest discover -s tests -p test_formation_clients.py -v
