name: Formation Python 3.9 checks
on:
  workflow_call:
  pull_request:
    paths-ignore:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/REPRODUCE.md'
      - 'docs/paper-map.md'
      - 'docs/drafts/**'
      - 'exploratory/**'
jobs:
  formation:
    runs-on: ubuntu-24.04  # Python 3.9 is not available on the ubuntu-latest (26.04) image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Free formation fixtures only
        run: python -m unittest discover -s tests -p 'test_formation*.py' -v
