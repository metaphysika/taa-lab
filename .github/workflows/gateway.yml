name: Gateway offline alignment
on: [push, pull_request]
jobs:
  reference-and-foundation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-gateway-properties.txt
      - name: Independently supplied trace structure and manifest
        run: |
          cd tests/expected_traces/v0.2.2
          sha256sum -c MANIFEST.sha256
          python -I tools/validate_traces.py .
      - name: Foundation, reference and runner boundary tests (no model calls)
        run: python -m unittest tests.test_gateway_foundation tests.test_gateway_reference tests.test_gateway_expected_bundle tests.test_gateway_alignment_v031 tests.test_gateway_spot_review tests.test_gateway_pipeline tests.test_gateway_executor tests.test_gateway_refund_runtime tests.test_gateway_production_runner tests.test_gateway_duties tests.test_gateway_adversarial tests.test_gateway_development tests.test_tracegrant_comparator tests.test_gateway_ablations tests.test_gateway_token_bindings tests.test_gateway_no_invalidation tests.test_cross_arm tests.test_gateway_roster_h1 tests.test_gateway_null_allocation tests.test_gateway_q15 tests.test_gateway_q16 tests.test_gateway_q14 tests.test_business_faults -v
      - name: Corrected context equivalence and independent pre-commit harm controls
        run: python -m unittest tests.test_context_canonicalization tests.test_commit_oracle -v
      - name: Deterministic retained-log replay and evidence attribution controls
        run: python -m unittest tests.test_gateway_replay -v
      - name: Q15 routing and ordered-acknowledgment regressions
        run: python -I scripts/check_gateway_v032.py --suite q15 --report "$RUNNER_TEMP/gateway-q15.json"
      - name: Q16 capacity, bounded episodes and source supersessions
        run: python -I scripts/check_gateway_v032.py --suite q16 --report "$RUNNER_TEMP/gateway-q16.json"
      - name: Q14 receipt-bound portions and corrected claim-line coverage
        run: python -I scripts/check_gateway_v032.py --suite q14 --report "$RUNNER_TEMP/gateway-q14.json"
      - name: Sensitive repeated-notice overlap and summed-overlap mutants on all three backends
        run: python -I scripts/check_gateway_q14_overlap.py --report "$RUNNER_TEMP/gateway-q14-overlap.json"
      - name: Common oracle Q14 over actual records on production, conventional, floor and static
        run: python -I scripts/check_gateway_q14_oracle.py --report "$RUNNER_TEMP/gateway-q14-oracle.json"
      - name: Q14 missing-receipt control uses original actual state and an isolated evidence omission
        run: python -I scripts/check_gateway_q14_receipts.py --report "$RUNNER_TEMP/gateway-q14-receipts.json"
      - name: Pin pre-Q15 source for all targeted regression failures
        uses: actions/checkout@v4
        with:
          ref: 9135bcdb264be955aadff7fae79feead99137c01
          path: gateway-pre-q15
          persist-credentials: false
      - name: Every Q15 scenario fails on pre-change policy
        run: python -I scripts/check_gateway_v032.py --suite q15 --implementation-root gateway-pre-q15 --expect-baseline --report "$RUNNER_TEMP/gateway-q15-before.json"
      - name: Targeted Q16 scenarios expose pre-change capacity defects
        run: python -I scripts/check_gateway_v032.py --suite q16 --implementation-root gateway-pre-q15 --expect-baseline --report "$RUNNER_TEMP/gateway-q16-before.json"
      - name: Every targeted Q14 scenario exposes its pre-change defect
        run: python -I scripts/check_gateway_v032.py --suite q14 --implementation-root gateway-pre-q15 --expect-baseline --report "$RUNNER_TEMP/gateway-q14-before.json"
      - name: Pre-Q14 oracle incorrectly discharges without a matching receipt
        run: python -I scripts/check_gateway_q14_receipts.py --implementation-root gateway-pre-q15 --expect-baseline --report "$RUNNER_TEMP/gateway-q14-receipts-before.json"
      - name: Q14 null allocation and cross-claim mirror controls
        run: python -I scripts/check_gateway_null_allocation.py --report "$RUNNER_TEMP/gateway-null-allocation.json"
      - name: Pin the pre-null-fix source
        uses: actions/checkout@v4
        with:
          ref: 5d0ca5cf69bb81fd2ef19bb3be64e9111a9b7b7d
          path: gateway-pre-null
          persist-credentials: false
      - name: Null allocation controls expose pre-change defects
        run: python -I scripts/check_gateway_null_allocation.py --implementation-root gateway-pre-null --expect-baseline --report "$RUNNER_TEMP/gateway-null-allocation-before.json"
      - name: H1 authenticated roster events in isolated regression worlds
        run: python -I scripts/check_gateway_roster_h1.py --report "$RUNNER_TEMP/gateway-roster-h1.json"
      - name: Pin the pre-H1 implementation for regression sensitivity
        uses: actions/checkout@v4
        with:
          ref: cbcb5a5ca7e01b0e7206a8cc4be5634410f92e36
          path: gateway-pre-v032
          persist-credentials: false
      - name: Every H1 targeted scenario fails on the pre-change implementation
        run: python -I scripts/check_gateway_roster_h1.py --implementation-root gateway-pre-v032 --expect-baseline --report "$RUNNER_TEMP/gateway-roster-h1-before.json"
      - name: Stage 6 duty deadline controls catch all three review mutations
        run: python -I scripts/check_gateway_duty_boundaries.py --report "$RUNNER_TEMP/gateway-duty-boundary-mutations.json"
      - name: Independent conventional SQL kernel components and real rollback sensitivity
        run: python -I scripts/check_conventional_kernel.py --output "$RUNNER_TEMP/conventional-kernel"
      - name: Independently implemented conventional W0 policy, ledger and host
        run: python -m unittest tests.test_conventional_policy tests.test_conventional_ledger tests.test_conventional_world -v
      - name: Conventional W0 runs the same frozen, regression and adversarial sources with SQL state audits
        run: python -I scripts/check_conventional_w0.py --report "$RUNNER_TEMP/conventional-w0.json"
      - name: Run independent expectations against reference; fail on disagreement or incomplete coverage
        run: python -m tests.trace_support.reference_runner --report "$RUNNER_TEMP/gateway-reference-v031.json"
      - name: Run Astra spot-check regressions and hidden-state detection guards
        run: python -I scripts/check_gateway_spot_review.py --report "$RUNNER_TEMP/gateway-spot-review-fixed.json"
      - name: Production frozen W0 and regressions (zero discrepancies AND zero incomplete)
        run: python -I scripts/check_gateway_stage5.py --require-complete --report "$RUNNER_TEMP/gateway-stage6-production.json"
      - name: Q11/Q12 regressions pass independently against both backends
        run: python -I scripts/check_gateway_q11_q12.py --report "$RUNNER_TEMP/gateway-q11-q12-fixed.json"
      - name: Checkout the exact pre-Q11/Q12 implementation
        uses: actions/checkout@v4
        with:
          ref: 59e48fcf5bcf6da5ae99cb0523f602187bb7e71a
          path: gateway-pre-q11-q12
          persist-credentials: false
      - name: Q11/Q12 regressions detect their pre-change defects
        run: python -I scripts/check_gateway_q11_q12.py --implementation-root gateway-pre-q11-q12 --expect-baseline --report "$RUNNER_TEMP/gateway-q11-q12-baseline.json"
      - name: Q13 citation absence and contradiction controls
        run: python -I scripts/check_gateway_q13.py --report "$RUNNER_TEMP/gateway-q13-fixed.json"
      - name: Checkout pre-Q13 implementation for sensitivity
        uses: actions/checkout@v4
        with:
          ref: 8083100944399d371c396535ec1e414267e217ba
          path: gateway-pre-q13
          persist-credentials: false
      - name: Q13 controls expose the pre-change defects
        run: python -I scripts/check_gateway_q13.py --implementation-root gateway-pre-q13 --expect-baseline --report "$RUNNER_TEMP/gateway-q13-baseline.json"
      - name: Four offline controllers on all five reviewed development pairs
        run: python -I scripts/run_gateway_development.py --report "$RUNNER_TEMP/gateway-development.json"
      - name: Checkout the unchanged pre-fix baseline for causal regression evidence
        uses: actions/checkout@v4
        with:
          ref: 9ddf84a460a28da56f71529a64a3b0da6d5ff49c
          path: gateway-pre-fix-baseline
          persist-credentials: false
      - name: Each defect reproduces on pre-fix main (packed-event twin remains a control)
        run: |
          python -I scripts/check_gateway_spot_review.py --implementation-root gateway-pre-fix-baseline --expect-baseline --report "$RUNNER_TEMP/gateway-spot-review-baseline.json"
          cd gateway-pre-fix-baseline
          python -m tests.trace_support.reference_runner --report "$RUNNER_TEMP/gateway-frozen-baseline.json"
      - name: P1-P6 generated checks and mutants (strict; open model/spec gaps fail)
        run: python -I scripts/check_gateway_properties.py --report "$RUNNER_TEMP/gateway-properties.json"
      - name: All frozen/regression adversarial programs plus Sol controls
        run: python -I scripts/check_gateway_adversarial.py --report "$RUNNER_TEMP/gateway-adversarial.json"
      - name: Pin pre-interface-fix runtime for adversarial sensitivity
        uses: actions/checkout@v4
        with:
          ref: 1dafc6645bb1e4e2173e4fe4bfb217451ddec622
          path: gateway-pre-adversarial-interface
          persist-credentials: false
      - name: Issuer-forgery control exposes pre-fix reference schema gap
        run: python -I scripts/check_gateway_adversarial.py --controls-only --expect-baseline --implementation-root gateway-pre-adversarial-interface --report "$RUNNER_TEMP/gateway-adversarial-before.json"
      - name: Frozen-contract TraceGrant reconstruction, all development inputs
        run: python -I scripts/run_tracegrant_comparator.py --report "$RUNNER_TEMP/tracegrant-development.json"
      - name: Engineering input replay on every arm (no final scoring)
        run: python -I scripts/check_gateway_all_arm_replay.py --report "$RUNNER_TEMP/gateway-all-arm-replay.json"
      - name: Preserve observed assertions and discrepancies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-reference-v031
          path: |
            ${{ runner.temp }}/gateway-all-arm-replay.json
            ${{ runner.temp }}/gateway-q14-overlap.json
            ${{ runner.temp }}/gateway-q14.json
            ${{ runner.temp }}/gateway-q14-before.json
            ${{ runner.temp }}/gateway-q14-oracle.json
            ${{ runner.temp }}/gateway-q14-receipts.json
            ${{ runner.temp }}/gateway-q14-receipts-before.json
            ${{ runner.temp }}/gateway-q16.json
            ${{ runner.temp }}/gateway-q16-before.json
            ${{ runner.temp }}/gateway-q15.json
            ${{ runner.temp }}/gateway-q15-before.json
            ${{ runner.temp }}/gateway-null-allocation.json
            ${{ runner.temp }}/gateway-null-allocation-before.json
            ${{ runner.temp }}/gateway-roster-h1.json
            ${{ runner.temp }}/gateway-roster-h1-before.json
            ${{ runner.temp }}/conventional-w0.json
            ${{ runner.temp }}/conventional-kernel/report.json
            ${{ runner.temp }}/conventional-kernel/*.stdout
            ${{ runner.temp }}/conventional-kernel/*.stderr
            ${{ runner.temp }}/gateway-reference-v031.json
            ${{ runner.temp }}/gateway-spot-review-fixed.json
            ${{ runner.temp }}/gateway-spot-review-baseline.json
            ${{ runner.temp }}/gateway-frozen-baseline.json
            ${{ runner.temp }}/gateway-stage6-production.json
            ${{ runner.temp }}/gateway-duty-boundary-mutations.json
            ${{ runner.temp }}/gateway-properties.json
            ${{ runner.temp }}/gateway-properties.attempts.jsonl
            ${{ runner.temp }}/gateway-adversarial.json
            ${{ runner.temp }}/gateway-adversarial-before.json
            ${{ runner.temp }}/gateway-development.json
            ${{ runner.temp }}/gateway-development.txt
            ${{ runner.temp }}/tracegrant-development.json
            ${{ runner.temp }}/gateway-q11-q12-fixed.json
            ${{ runner.temp }}/gateway-q11-q12-baseline.json
            ${{ runner.temp }}/gateway-q13-fixed.json
            ${{ runner.temp }}/gateway-q13-baseline.json
          if-no-files-found: error
